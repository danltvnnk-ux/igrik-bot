<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ЭЗС 12-26 — Расписание</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS (для минималистичного дизайна) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #17212b);
            color: var(--tg-theme-text-color, #f5f5f5);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #232e3c);
        }
        .accent-btn {
            background-color: var(--tg-theme-button-color, #5288c1);
            color: var(--tg-theme-button-text-color, #ffffff);
        }
    </style>
</head>
<body class="p-4 antialiased selection:bg-none">

    <!-- Шапка -->
    <header class="mb-4 text-center">
        <h1 class="text-xl font-bold tracking-tight">Группа ЭЗС 12-26</h1>
        <p id="week-info" class="text-xs opacity-60 mt-1">Загрузка недели...</p>
    </header>

    <!-- Переключатель дней недели -->
    <div id="days-bar" class="flex space-x-2 overflow-x-auto pb-3 mb-3 no-scrollbar text-sm">
        <!-- Дни недели будут сгенерированы скриптом -->
    </div>

    <!-- Контейнер для списка пар -->
    <main id="schedule-container" class="space-y-2.5 mb-16">
        <div class="text-center text-xs opacity-50 py-8">Загрузка расписания...</div>
    </main>

    <!-- Нижняя навигация -->
    <nav class="fixed bottom-0 left-0 right-0 card border-t border-white/5 flex justify-around py-2.5 text-xs font-medium">
        <button onclick="switchTab('schedule')" id="tab-schedule-btn" class="flex flex-col items-center opacity-100">
            <span>📅</span>
            <span>Расписание</span>
        </button>
        <button onclick="switchTab('hw')" id="tab-hw-btn" class="flex flex-col items-center opacity-50">
            <span>📝</span>
            <span>Домашка</span>
        </button>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        const days = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
        let selectedDayIndex = new Date().getDay() - 1;
        if (selectedDayIndex < 0 || selectedDayIndex > 5) selectedDayIndex = 0; // Если воскресенье -> понедельник

        // Инициализация дней
        function renderDaysBar() {
            const bar = document.getElementById('days-bar');
            bar.innerHTML = days.map((day, idx) => `
                <button onclick="selectDay(${idx})" 
                        class="px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all ${idx === selectedDayIndex ? 'accent-btn font-semibold' : 'card opacity-70'}">
                    ${day}
                </button>
            `).join('');
        }

        function selectDay(idx) {
            selectedDayIndex = idx;
            renderDaysBar();
            loadSchedule();
        }

        async function loadSchedule() {
            const container = document.getElementById('schedule-container');
            container.innerHTML = '<div class="text-center text-xs opacity-50 py-8">Загрузка...</div>';
            
            try {
                const res = await fetch(`/api/schedule?day=${selectedDayIndex}`);
                const data = await res.json();
                
                document.getElementById('week-info').innerText = data.week_name;

                if (!data.lessons || data.lessons.length === 0) {
                    container.innerHTML = '<div class="text-center text-sm opacity-60 py-10 card rounded-xl p-4">Пар нет (выходной) 🎉</div>';
                    return;
                }

                container.innerHTML = data.lessons.map(les => `
                    <div class="card p-3.5 rounded-xl flex items-center justify-between border border-white/5 shadow-sm">
                        <span class="text-sm font-medium opacity-90">${les}</span>
                    </div>
                `).join('');
            } catch (e) {
                container.innerHTML = '<div class="text-center text-xs text-red-400 py-6">Ошибка загрузки расписания</div>';
            }
        }

        async function loadHW() {
            const container = document.getElementById('schedule-container');
            container.innerHTML = '<div class="text-center text-xs opacity-50 py-8">Загрузка домашнего задания...</div>';
            
            try {
                const res = await fetch('/api/homework');
                const data = await res.json();

                if (!data.items || data.items.length === 0) {
                    container.innerHTML = '<div class="text-center text-sm opacity-60 py-10 card rounded-xl p-4">Домашних заданий нет 🎉</div>';
                    return;
                }

                container.innerHTML = data.items.map(item => `
                    <div class="card p-3.5 rounded-xl space-y-1 border border-white/5">
                        <div class="flex justify-between text-xs font-semibold opacity-70">
                            <span>${item.subject}</span>
                            <span>${item.date}</span>
                        </div>
                        <p class="text-sm opacity-90">${item.task}</p>
                    </div>
                `).join('');
            } catch (e) {
                container.innerHTML = '<div class="text-center text-xs text-red-400 py-6">Ошибка загрузки ДЗ</div>';
            }
        }

        function switchTab(tab) {
            document.getElementById('tab-schedule-btn').style.opacity = tab === 'schedule' ? '1' : '0.5';
            document.getElementById('tab-hw-btn').style.opacity = tab === 'hw' ? '1' : '0.5';
            
            if (tab === 'schedule') {
                document.getElementById('days-bar').classList.remove('hidden');
                loadSchedule();
            } else {
                document.getElementById('days-bar').classList.add('hidden');
                loadHW();
            }
        }

        // Старт
        renderDaysBar();
        loadSchedule();
    </script>
</body>
</html>
